name: perf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O GITHUB_TOKEN deste job serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público).
# `pnpm build` é local e o relatório de tamanho é escrita em arquivo do runner
# (`>> $GITHUB_STEP_SUMMARY`), sem token. Ver o comentário em ci.yml para o
# porquê de o bloco ficar no topo.
permissions:
  contents: read

# ── Uma rodada por PR: o push novo cancela a antiga ──────────────────────────
#
# Medido em 18/09/2026, com a fila do Actions estrangulada: `ci/rebalancear-
# partes-do-e2e` tinha **8 runs ativos em 2 heads distintos**, e
# `feat/marketplace-de-extensoes`, 7 em 2. Cada push deixava a rodada anterior
# queimando runner até o fim, competindo com trabalho vivo — e o efeito que
# chega ao contribuidor é o PR parado, porque o job dele espera atrás de uma
# medição de um commit que já não existe.
#
# `cancel-in-progress` é CONDICIONAL de propósito, e a condição é a parte que
# importa:
#
#   pull_request        → cancela. A medição de um head superado não vale nada.
#   push (main) e tag   → NUNCA cancela. A rodada da `main` é a ÚNICA medição da
#                         árvore integrada; matá-la deixa o repositório sem saber
#                         se o conjunto passa, que é pior que a fila cheia. E o
#                         run de publicação de tag reporta `headBranch` de tag,
#                         não `main` — cancelá-lo publicaria versão sem registro.
#
# O grupo é por PR (e não por branch) para que reabrir um PR não colida com o
# run de outro que aponte para a mesma ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # `cancel-in-progress` só em PR: na `main`, o vermelho de um commit
  # intermediário é a única medida que existe daquela árvore, e apagá-la deixa a
  # integração sem cobertura.
  #
  # ⚠️ MAS ISSO NÃO É "a main nunca cancela", e a diferença foi MEDIDA (18/09):
  # o GitHub guarda **uma única rodada PENDENTE por grupo**. Uma rodada da `main`
  # que ainda não começou é cancelada quando a próxima chega, mesmo com
  # `cancel-in-progress: false`. Só a que JÁ está rodando é preservada.
  #
  # O efeito prático é aceitável — a `main` mais nova é a que se mede, e ela
  # contém a anterior. O que não era aceitável era a frase: quem lesse "a main
  # nunca cancela" e visse uma rodada da `main` cancelada iria procurar um
  # cancelador humano, que é o modo de falha nº 1 deste repositório
  # (`timeout-minutes` também produz `cancelled`).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # "off", não vazio: vazio seleciona o Sentry DA COMUNIDADE
          # (lib/sentry/dsn.ts:8-10). A intenção aqui sempre foi desligar, e
          # com aspas vazias ela não era alcançada — o build seguia com o DSN
          # padrão embutido.
          SENTRY_DSN: "off"

      - name: Report bundle sizes
        run: |
          {
            echo "## Build output sizes"
            du -sh .next 2>/dev/null || true
            if [ -d .next/static ]; then du -sh .next/static; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: Lighthouse CI + bundle-analyzer thresholds deferred (S-12.05 follow-up).
